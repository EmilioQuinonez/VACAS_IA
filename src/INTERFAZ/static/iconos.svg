    Íconos de la interfaz, en una cuadrícula de 24 x 24 con trazo (stroke) y currentColor: toman el color del
    texto, así que funcionan en modo claro y oscuro. Se usan con <svg class="ico"><use href="iconos.svg#id"/></svg>.
    Los genéricos (reloj, calendario, termómetro, sol, gota, leche, rayo, reloj de arena, número, alerta,
    check, ojo, info, gráfica, lista, libro, diana, historial y establo) están adaptados de Lucide
    (https://lucide.dev, licencia ISC). Los del rancho (vaca, robot, ubre, pezonera, patada, mosca y salud)
    se dibujaron para este proyecto.
  -->

